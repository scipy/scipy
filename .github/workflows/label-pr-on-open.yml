name: "Label PR on Open"
on:
  pull_request_target:
    types: [opened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  label_pull_request:
    name: Label PR
    # Permissions needed for labelling Pull Requests automatically
    # https://docs.github.com/en/actions/security-guides/automatic-token-authentication
    permissions:
      contents: read
      pull-requests: write  # needed to apply label
    runs-on: ubuntu-latest
    steps:
    # label based on changed files
    - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
      continue-on-error: true
      if: github.repository == 'scipy/scipy'
      with:
        repo-token: "${{ secrets.GITHUB_TOKEN }}"
        configuration-path: ".github/label-filename.yml"
    # label based on PR title
    - uses: github/issue-labeler@ccca1e16fcb66762200e616fc29b57b940c1cb67 # v3.5
      if: github.repository == 'scipy/scipy'
      with:
        configuration-path: .github/label-title.yml
        include-title: 1
        include-body: 0
        enable-versioned-regex: 0
        repo-token: ${{ secrets.GITHUB_TOKEN }}
