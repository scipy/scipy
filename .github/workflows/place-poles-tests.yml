name: SciPy place_poles regression tests

on:
  push:
    branches:
      - fix-place-poles-rank-deficient-b
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran libopenblas-dev liblapack-dev pkg-config python3-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements/build.txt -r requirements/dev.txt -r requirements/test.txt

      - name: Build SciPy
        run: spin build

      - name: Run signal tests
        run: spin test -v -t scipy.signal.tests.test_ltisys --no-build
