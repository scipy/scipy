name: Lint

on:
  push:
    branches:
      - maintenance/**
  pull_request:
    branches:
      - main
      - maintenance/**

permissions:
  contents: read # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test_lint:
    name: Lint
    # If using act to run CI locally the github object does not exist and the usual skipping should not be enforced
    if: "github.repository == 'scipy/scipy' || github.repository == ''"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # previous commits used in tools/linting/lint.py
          submodules: recursive
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.71.0
          cache: false
          environments: lint

      - name: Spin Lint
        run: |
          set -euo pipefail
          pixi run lint --diff-against origin/$GITHUB_BASE_REF

      - name: Check that Python.h is first in any file including it.
        shell: bash
        run: pixi run check-python-h

      - name: Check module interdependencies
        run: pixi run tach-check

      - name: Check external dependencies
        run: pixi run tach-check-external

      - name: GitHub Actions static analysis
        run: |
          pixi run actionlint
          pixi run zizmor
