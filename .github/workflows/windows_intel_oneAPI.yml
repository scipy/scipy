name: Windows tests (MSVC + icx + OpenBLAS)
# TODO: replace OpenBLAS with MKL. This is harder to get to build, so we merged with OpenBLAS first.

on:
  push:
    branches:
      - maintenance/**
  pull_request:
    branches:
      - main
      - maintenance/**
  schedule:
  #        ┌───────────── minute (0 - 59)
  #        │  ┌───────────── hour (0 - 23)
  #        │  │  ┌───────────── day of the month (1 - 31)
  #        │  │  │  ┌───────────── month (1 - 12 or JAN-DEC)
  #        │  │  │  │ ┌───────────── day of the week (0 - 6 or SUN-SAT)
  #        │  │  │  │ │
  - cron: "9  9 2/2 * *"

permissions:
   contents: read  # to fetch code (actions/checkout)

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # get_commit_message:
  #   name: Get commit message
  #   uses: ./.github/workflows/commit_message.yml

  msvc_ifx_blas:
    name: py3.12, spin
    # needs: get_commit_message
    # # Ensure (a) this doesn't run on forks by default, and
    # #        (b) it does run with Act locally (`github` doesn't exist there)
    # if: >
    #   needs.get_commit_message.outputs.message == 1
    #   && (github.repository == 'scipy/scipy' || github.repository == '')
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@a0af7a228712d6121d37aba47adf55c1332c9c2e # v0.9.4
        with:
          pixi-version: v0.77.1
          cache: false
          environments: >-
            build-intel
            test-intel
          activate-environment: build-intel

      - name: cache install
        id: cache-install
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
              C:\Program Files (x86)\Intel\oneAPI\compiler
              C:\Program Files (x86)\Intel\oneAPI\setvars.bat
              C:\Program Files (x86)\Intel\oneAPI\setvars-vcvarsall.bat
          key: install-${{ env.WINDOWS_HPC_URL }}-compiler

      - name: Initialise Intel oneAPI and Build SciPy
        run: pixi run build-intel

      - name: Test scipy
        run: pixi run --environment=test-intel --skip-deps test-intel -s datasets
