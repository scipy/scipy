version: 2.1

orbs:
  # https://circleci.com/developer/orbs/orb/prefix-dev/pixi
  # check content of the orb when updating the version
  pixi: prefix-dev/pixi@0.1.0

# gen3 resource classes are only valid with the `current` tag, not a pinned
# dated tag -- a pinned tag is rejected with "is not a valid resource class"
_machine_image: &machine_image
  image: ubuntu-2604:current

# Aliases to reuse
_defaults: &defaults
  machine:
    <<: *machine_image
  # large.gen3 is 4 vCPU / 16 GiB; drop the `.gen3` suffix if it is unavailable
  resource_class: large.gen3
  working_directory: ~/repo

commands:
  apt-install:
    description: Install apt packages that the machine image does not ship
    parameters:
      packages:
        type: string
    steps:
      - run:
          name: apt install << parameters.packages >>
          command: |
            # retries/timeouts: the machine image's regional mirror 503s at times
            # and apt otherwise spins on it until the no-output timeout fires
            APT_OPTS="-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30"
            timeout 600 sudo apt-get update $APT_OPTS
            timeout 600 sudo apt-get install -y $APT_OPTS << parameters.packages >>

  check-skip:
    steps:
      - run:
          name: Check-skip
          command: |
            if [ ! -d "scipy" ]; then
              echo "Build was not run due to skip, exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
              circleci-agent step halt;
            fi

            export git_log=$(git log --max-count=1 --pretty=format:"%B" | tr "\n" " ")
            echo "Got commit message:"
            echo "${git_log}"
            if [[ -v CIRCLE_PULL_REQUEST ]] && ([[ "$git_log" == *"[skip circle]"* ]] || [[ "$git_log" == *"[circle skip]"* ]] || [[ "$git_log" == *"[lint only]"* ]] || [[ "$git_log" == *"[skip ci]"* ]]); then
              echo "Skip detected, exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
              circleci-agent step halt;
            fi

  merge:
    steps:
      - run:
          name: merge with upstream
          command: |
            echo $(git log -1 --pretty=%B) | tee gitlog.txt
            echo ${CI_PULL_REQUEST//*pull\//} | tee merge.txt
            if [[ $(cat merge.txt) != "" ]]; then
              echo "Merging $(cat merge.txt)";
              git remote add upstream https://github.com/scipy/scipy.git;
              git pull --ff-only upstream "refs/pull/$(cat merge.txt)/merge";
              git fetch upstream main;
            fi

jobs:
# Build SciPy from source
  build_scipy:
    <<: *defaults
    environment:
      CCACHE_DIR: /home/circleci/.ccache
      CCACHE_MAXSIZE: "1G"
    steps:
      - checkout
      - check-skip
      - merge

      - pixi/pixi_setup:
          env: "build"

      - run:
          name: update submodules
          command: |
            git submodule init
            git submodule update

      - run:
          name: ccache cache key (one new cache per day)
          command: date +%F > .ccache-date

      - restore_cache:
          keys:
              - ccache-{{ .Branch }}-{{ checksum ".ccache-date" }}
              - ccache-{{ .Branch }}-
              - ccache-main-
              - ccache-

      - run:
          name: clear ccache stats
          command: pixi exec ccache --zero-stats

      - run:
          name: build SciPy
          # -j 4 matches the vCPUs; spin's default counts *physical* cores, which
          # a 4-vCPU VM may report as 2
          command: pixi run build -j 4

      - run:
          name: ccache performance
          command: pixi exec ccache -s

      - save_cache:
          key: ccache-{{ .Branch }}-{{ checksum ".ccache-date" }}
          paths:
            - ~/.ccache

      # every downstream job restores this from cache; shipping it in the
      # workspace as well makes those restores collide file-by-file
      - run:
          name: drop the pixi env from the workspace
          command: rm -rf ~/repo/.pixi

      - persist_to_workspace:
          root: ~/
          paths:
            # not "." -- that would also ship ~/.ccache, which is separately
            # cached and unused downstream
            - repo

# Build docs and distribution-ready tree
  build_docs_dist:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/

      - check-skip
      - pixi/pixi_setup:
          env: "docs"

      - run:
          name: build docs
          no_output_timeout: 25m
          # `spin docs` sets SPHINXOPTS="-W -j auto"; on a VM `auto` is the 4 vCPUs
          # tee: the check below greps this file, and greps clean if it is absent
          command: pixi run --skip-deps docs doc-dist 2>&1 | tee sphinx_log.txt

      - run:
          name: Check sphinx log for warnings (which are treated as errors)
          when: always
          command: |
            ! grep "^.* WARNING: .*$" sphinx_log.txt

      - store_artifacts:
          path: doc/build/html
          destination: html

      - persist_to_workspace:
          root: doc/build
          paths:
            - html

# Run benchmarks

  run_benchmarks:
    <<: *defaults
    # not just inherited: the sparse and stats benchmarks need the 16 GiB, so
    # this job must not be shrunk along with the rest
    resource_class: large.gen3
    steps:
      - attach_workspace:
          at: ~/

      - check-skip

      - run:
          name: Check-not-docs-only
          command: |
            # If the latest commit was tagged with [docs only], don't run
            # the benchmarks.
            # In the following, --skip=1 is needed to skip the merge commit
            # that occurred in the build_scipy job.
            export git_log=$(git log --skip=1 --max-count=1 --pretty=format:"%B" | tr "\n" " ")
            echo "Got commit message:"
            echo "${git_log}"
            if [[ -v CIRCLE_PULL_REQUEST ]] && ([[ "$git_log" == *"[docs only]"* ]]); then
              echo "[docs only] detected, so benchmarks skipped. Exiting job ${CIRCLE_JOB} for PR ${CIRCLE_PULL_REQUEST}."
              circleci-agent step halt;
            fi

      - pixi/pixi_setup:
          env: "bench"

      - run:
          name: register CI machine with asv
          working_directory: benchmarks
          command: pixi run -e bench asv machine --machine CircleCI

      - run:
          name: report available memory and address space limit
          command: pixi run -e bench python -c "import psutil, resource; print(psutil.virtual_memory(), resource.getrlimit(resource.RLIMIT_AS))"

      - run:
          name: run asv benchmarks
          no_output_timeout: 30m
          # --no-mem-limit: spin caps RLIMIT_AS at 70% of RAM, but that is address
          # space, which FFT/BLAS thread pools exhaust well before actual memory
          # --no-dry-run: `asv publish` below needs the results on disk
          # DistributionsAll is skipped for wall time, not because it is slow:
          # 1754 parameter combinations for 13s of compute, so ~5 min of the
          # job is asv spawning one process per combination
          command: pixi run bench --quick --no-mem-limit --no-dry-run -t '^((?!BenchGlobal|QuadraticAssignment|DistributionsAll).)*$'

      - run:
          name: publish benchmark html
          working_directory: benchmarks
          command: pixi run -e bench asv publish

      - store_artifacts:
          path: benchmarks/html
          destination: html-benchmarks

# Reference guide checking
  refguide_check:
    <<: *defaults
    steps:
      - attach_workspace:
          at: ~/

      - check-skip
      - pixi/pixi_setup:
          # add "smoke-docs" when pixi_setup can accept multiple envs
          env: "docs"

      - run:
          name: refguide_check
          no_output_timeout: 25m
          command: pixi run --skip-deps refguide-check

      - run:
          name: smoke-docs
          no_output_timeout: 35m
          command: pixi run --skip-deps smoke-docs

      - apt-install:
          packages: wamerican-small

      - run:
          name: smoke-tutorials
          no_output_timeout: 10m
          command: pixi run --skip-deps smoke-tutorials

# Upload build output to scipy/devdocs repository, using SSH deploy keys.
# The keys are only available for builds on main branch.
# https://developer.github.com/guides/managing-deploy-keys/
# https://circleci.com/docs/2.0/configuration-reference/#add_ssh_keys

  deploy:
    <<: *defaults
    # a git clone and push; nothing here is CPU- or memory-bound
    resource_class: medium.gen3
    steps:
      - attach_workspace:
          at: /tmp/build

      - add_ssh_keys:
          fingerprints:
            - "1d:47:cf:2e:ea:7c:15:cf:ec:bb:1f:44:e2:56:16:d3"

      - run:
          name: upload
          command: |
            set -e;
            mkdir -p ~/.ssh
            echo -e "Host *\nStrictHostKeyChecking no" > ~/.ssh/config
            chmod og= ~/.ssh/config
            git clone git@github.com:scipy/devdocs.git devdocs;
            cd devdocs;
            (git checkout --orphan tmp && git branch -D gh-pages || true);
            git checkout --orphan gh-pages;
            git reset --hard;
            cp -R /tmp/build/html/. .;
            touch .nojekyll;
            git config --global user.email "scipy-circleci-bot@nomail";
            git config --global user.name "scipy-circleci-bot";
            git config --global push.default simple;
            git add . > /dev/null;
            git commit -m "Docs build of $CIRCLE_SHA1";
            git push --set-upstream origin gh-pages --force

workflows:
  version: 2
  default:
    jobs:
      - build_scipy
      - build_docs_dist:
          requires:
            - build_scipy
      - run_benchmarks:
          requires:
            - build_scipy
      - refguide_check:
          requires:
            - build_scipy
      - deploy:
          requires:
            - build_docs_dist
          filters:
            branches:
              only: main
